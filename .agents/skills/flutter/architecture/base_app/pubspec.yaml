name: gse_base_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  animate_do: ^5.1.0
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  dart_jsonwebtoken: ^3.4.1
  dio: ^5.11.0
  email_validator: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  formz: ^0.8.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.5.0
  gse_design_system:
    path: packages/design_system
  gse_localization:
    path: packages/gse_localization
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/imgs/
    - assets/app/

  fonts:
    - family: poppins
      fonts:
        - asset: fonts/Poppins/Poppins-Black.ttf
          weight: 900
        - asset: fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: fonts/Poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: fonts/Poppins/Poppins-Thin.ttf
          weight: 100
